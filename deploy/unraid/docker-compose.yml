# Ledgerly Beta on Unraid
#
# For the Docker Compose Manager plugin (Apps > "Docker Compose Manager"):
#   Docker tab > Compose > Add New Stack > name it "ledgerly-beta" > Edit Stack > Compose File > paste this file > Save
#   then Compose Up.
#
# Open http://<your-unraid-ip>:5006 and create the first account (it becomes the admin).
# To update to the newest beta: Update Stack (pulls the image and recreates the container).
#
# Data lives in /mnt/user/appdata/ledgerly-beta:
#   data/  the SQLite database (ledgerly.db)
#   keys/  encryption keys for sign-in cookies and the saved email password. Keep them with the data.
#
# The container gives those folders to PUID:PGID when it starts, then runs Ledgerly as that user (not root).

name: ledgerly-beta

services:
  ledgerly-beta:
    image: ghcr.io/007darkmatter5/ledgerly:beta
    container_name: ledgerly-beta
    restart: unless-stopped
    ports:
      - "5006:8080"                      # change the left number if 5006 is taken
    environment:
      PUID: 99                           # nobody
      PGID: 100                          # users
      Ledgerly__Channel: Beta
      # TZ: America/Chicago              # only if the /etc/localtime mount below doesn't give the right time zone
      # Ledgerly__Culture: en-US          # money/date format (default en-US)
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"   # behind a reverse proxy (SWAG, Nginx Proxy Manager, Traefik) that handles HTTPS
    volumes:
      - /mnt/user/appdata/ledgerly-beta/data:/data
      - /mnt/user/appdata/ledgerly-beta/keys:/keys
      - /etc/localtime:/etc/localtime:ro  # use the server's time zone so "today" and due dates are right
    labels:
      # WebUI link in the Docker tab ([PORT:8080] is the container port; Unraid shows the matching host port).
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
